name: 'action-pin'
description: 'Check and pin GitHub Actions to commit SHAs while preserving comments and ordinary workflow formatting'
author: 'emirhan-karaca'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  check:
    description: 'Check for unpinned actions (fails if unpinned actions are found)'
    required: false
    default: 'true'
  fix:
    description: 'Fix workflows in place by pinning actions to commit SHAs'
    required: false
    default: 'false'
  dir:
    description: 'Directory containing workflow files'
    required: false
    default: '.github/workflows'
  token:
    description: 'GitHub token for API resolution'
    required: false
    default: ${{ github.token }}
  version:
    description: 'Build the selected action source, or download an exact release tag such as v1.0.0'
    required: false
    default: 'source'
  checksum:
    description: 'Required SHA-256 of the release archive for this runner OS/architecture when version is a release tag'
    required: false
    default: ''
  resolve:
    description: 'Resolve suggested commit SHAs in check mode (requires network access)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Run action-pin
      shell: bash
      env:
        INPUT_CHECK: ${{ inputs.check }}
        INPUT_FIX: ${{ inputs.fix }}
        INPUT_DIR: ${{ inputs.dir }}
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_CHECKSUM: ${{ inputs.checksum }}
        INPUT_RESOLVE: ${{ inputs.resolve }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        bash "$ACTION_PATH/scripts/run-action.sh"
